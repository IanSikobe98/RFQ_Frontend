server {

  # -------------------------
  # HTTP (Port 8080)
  # -------------------------
  listen 8080;
  server_name _;

  # Redirect HTTP → HTTPS
  return 301 https://$host$request_uri;
}

# -------------------------
# HTTPS (Port 443)
# -------------------------
server {

  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/ssl/wildcard_kingdombankltd_co_ke.crt;
  ssl_certificate_key /etc/nginx/ssl/wildcard_kingdombankltd_co_ke.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  sendfile on;
  keepalive_timeout 60;
  default_type application/octet-stream;

  real_ip_header X-Forwarded-For;
  set_real_ip_from 0.0.0.0/0;

  server_tokens off;

  gzip on;
  gzip_http_version 1.1;
  gzip_disable "MSIE [1-6]\.";
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied expired no-cache no-store private auth;
  gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
  gzip_comp_level 9;
  gzip_buffers 32 8k;

  root /usr/share/nginx/html;
  index index.html index.htm;

  # -------------------------
  # FRONTEND (Vue SPA)
  # -------------------------
  location / {

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer-when-downgrade";
    add_header Content-Security-Policy "default-src * data: 'unsafe-eval' 'unsafe-inline'" always;

    try_files $uri $uri/ /index.html;
    expires -1;
    access_log off;
    log_not_found off;
  }

  # -------------------------
  # BACKEND API (Spring Boot)
  # -------------------------
  location /rfqService/ {

    proxy_pass https://10.0.1.209:9072/rfqService/;

    proxy_ssl_verify off;

    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # IMPORTANT for POST/PUT/DELETE (prevents 405 issues in proxying)
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  # -------------------------
  # STATIC FILE CACHING
  # -------------------------
  location ~* \.(?:css|js)$ {
    access_log off;
    log_not_found off;
    add_header Cache-Control "no-cache, public, must-revalidate, proxy-revalidate";
  }

  location ~* \.(?:jpg|jpeg|gif|png|ico|xml|webp|svg)$ {
    access_log off;
    log_not_found off;
    expires 60m;
    add_header Cache-Control "public";
  }

  location ~* \.(?:eot|woff|woff2|ttf|svg|otf)$ {
    access_log off;
    log_not_found off;
    expires 60m;
    add_header Cache-Control "public";
    add_header Access-Control-Allow-Origin *;
  }

  location ~ /\. {
    access_log off;
    log_not_found off;
    deny all;
  }
}